<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>

<body>
<a-scene
mindar-image="imageTargetSrc: ./assets/tree.mind;"
color-space="sRGB"
renderer="colorManagement: true, physicallyCorrectLights"
vr-mode-ui="enabled: false"
device-orientation-permission-ui="enabled: false"
>


<a-assets>
<!-- tracking image (optional, you can remove later) -->
<img id="card" src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/card.png" />

<!-- YOUR MODELS -->
<a-asset-item id="beach-umbrella" src="./assets/beach-umbrella.glb"></a-asset-item>
<a-asset-item id="palm-tree" src="./assets/palm-tree.glb"></a-asset-item>
<a-asset-item id="beach-ball" src="./assets/beach-ball.glb"></a-asset-item>
</a-assets>

<!-- LIGHTING (important) -->
<a-light type="ambient" intensity="1"></a-light>
<a-light type="directional" position="0 1 1"></a-light>

<a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

<a-entity mindar-image-target="targetIndex: 0">

<!-- TREE (center) -->
<a-entity position="0 0 0">
<a-gltf-model
src="#palm-tree"
position="0 0.4 0"
scale="0.15 0.15 0.15">
</a-gltf-model>
</a-entity>

<!-- UMBRELLA (far LEFT + higher) -->
<a-entity position="-0.5 0.5 0">
<a-gltf-model
src="#beach-umbrella"
position="0 0.4 0"
scale="0.01 0.01 0.01">
</a-gltf-model>
</a-entity>

<!-- BALL (far RIGHT) -->
<a-entity position="0.6 0 0">
<a-gltf-model
src="#beach-ball"
scale="0.13 0.13 0.13"
animation="property: position; to: 0.6 0.2 0; dur: 800; loop: true; dir: alternate">
</a-gltf-model>
</a-entity>

</a-entity>
