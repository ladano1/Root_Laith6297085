<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cyber Gaming Portal</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
overflow:hidden;
background:black;
font-family:Arial,sans-serif;
}



/* HUD */

.hud{
position:absolute;
top:25px;
left:30px;
z-index:100;
color:#00ffff;

text-shadow:
0 0 10px #00ffff,
0 0 30px #00ffff,
0 0 60px #00ffff;
}

.hud h1{
font-size:2.5rem;
letter-spacing:6px;
}

.hud p{
margin-top:8px;
font-size:0.9rem;
color:white;
letter-spacing:3px;
}



/* STATUS */

.status{
position:absolute;
bottom:30px;
right:30px;
z-index:100;
color:#9d4edd;
text-align:right;
font-size:0.85rem;
letter-spacing:2px;

text-shadow:
0 0 10px #9d4edd,
0 0 30px #9d4edd;
}



/* SCANLINES */

.scanline{
position:absolute;
inset:0;
pointer-events:none;
z-index:999;

background:
repeating-linear-gradient(
to bottom,
rgba(255,255,255,0.03),
rgba(255,255,255,0.03) 1px,
transparent 1px,
transparent 4px
);
}



/* VIGNETTE */

.vignette{
position:absolute;
inset:0;
pointer-events:none;
z-index:998;

background:
radial-gradient(
circle,
transparent 45%,
rgba(0,0,0,0.85) 100%
);
}

</style>

</head>

<body>



<!-- START SCREEN -->

<div id="startScreen"

style="
position:fixed;
inset:0;
background:rgba(0,0,0,0.93);
z-index:5000;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
text-align:center;
color:white;
font-family:Arial;
">

<h1 style="
font-size:3rem;
color:#00ffff;
text-shadow:0 0 25px #00ffff;
margin-bottom:20px;
">

CYBER GAMING PORTAL

</h1>

<p style="
font-size:1.2rem;
max-width:700px;
line-height:1.8;
padding:0 30px;
">

Keep tapping the
<span style="color:#00ffff;">W</span>
key to move forward endlessly through the cyber city.

</p>

<button id="startBtn"

style="
margin-top:40px;
padding:18px 45px;
font-size:1rem;
border:none;
border-radius:14px;
background:#00ffff;
color:black;
font-weight:bold;
cursor:pointer;
box-shadow:0 0 25px #00ffff;
">

START GAME

</button>

</div>



<!-- HUD -->

<div class="hud">

<h1>CYBER GAMING PORTAL</h1>

<p id="alertText">
MULTIVERSE CORE ONLINE
</p>

</div>



<!-- STATUS -->

<div class="status">

CITY STATUS: ONLINE<br>
NEURAL GRID: ACTIVE<br>
QUANTUM ENERGY: STABLE

</div>



<div class="scanline"></div>
<div class="vignette"></div>



<a-scene
id="scene"
renderer="antialias:true; colorManagement:true;"
fog="type: exponential; color: #020208; density: 0.02">



<!-- ASSETS -->

<a-assets>

<a-asset-item
id="chair"
src="./assets/chair.glb">
</a-asset-item>

</a-assets>



<!-- CAMERA -->

<a-entity
id="rig"
position="0 1.7 12">

<a-camera
look-controls>

<a-cursor
color="#00ffff">
</a-cursor>

</a-camera>

</a-entity>



<!-- SKY -->

<a-sky color="#020208"></a-sky>



<!-- LIGHTING -->

<a-light
type="ambient"
color="#ffffff"
intensity="1.3">
</a-light>

<a-light
type="directional"
position="0 30 -20"
color="#00ffff"
intensity="1.8">
</a-light>



<!-- GROUND -->

<a-plane
position="0 0 0"
rotation="-90 0 0"
width="1000"
height="5000"
color="#111217">
</a-plane>



<!-- ROAD -->

<a-box
position="0 0.05 -700"
width="14"
height="0.1"
depth="4000"
color="#1b1d25">
</a-box>



<!-- ROAD LINES -->

<a-box
position="-7 0.08 -700"
width="0.08"
height="0.03"
depth="4000"
color="#00ffff"
material="emissive:#00ffff">
</a-box>

<a-box
position="7 0.08 -700"
width="0.08"
height="0.03"
depth="4000"
color="#00ffff"
material="emissive:#00ffff">
</a-box>



<!-- ROTATING CHAIR -->

<a-entity
position="0 0 -8"
rotation="0 180 0"
scale="3 3 3"

animation="
property: rotation;
to: 0 540 0;
loop: true;
dur: 6000;
easing: linear
">

<a-gltf-model
src="#chair">
</a-gltf-model>

</a-entity>



</a-scene>



<script>

const scene =
document.querySelector('#scene')

const rig =
document.querySelector('#rig')

const alertText =
document.querySelector('#alertText')

const startScreen =
document.querySelector('#startScreen')

const startBtn =
document.querySelector('#startBtn')

let gameStarted = false



/* START GAME */

startBtn.addEventListener('click',()=>{

startScreen.style.display = 'none'

gameStarted = true

})



/* STARFIELD */

for(let i = 0; i < 350; i++){

const star =
document.createElement('a-sphere')

star.setAttribute(
'radius',
Math.random()*0.05 + 0.01
)

star.setAttribute(
'position',
`
${(Math.random()-0.5)*1200}
${(Math.random()-0.5)*600}
${-Math.random()*1800}
`
)

star.setAttribute(
'color',
Math.random() > 0.5
? '#00ffff'
: '#ffffff'
)

star.setAttribute(
'material',
'emissive:#ffffff'
)

scene.appendChild(star)

}



/* STREET LIGHTS */

for(let i = 0; i < 35; i++){

const z = -20 - i * 35

createStreetLight(
-10,
z,
i % 2 === 0 ? '#00ffff' : '#9d4edd'
)

createStreetLight(
10,
z,
i % 2 === 0 ? '#9d4edd' : '#00ffff'
)

}

function createStreetLight(x,z,color){

const pole =
document.createElement('a-cylinder')

pole.setAttribute(
'position',
`${x} 4 ${z}`
)

pole.setAttribute('radius',0.08)
pole.setAttribute('height',8)
pole.setAttribute('color','#2a2a35')

scene.appendChild(pole)

const bulb =
document.createElement('a-sphere')

bulb.setAttribute(
'position',
`${x} 8 ${z}`
)

bulb.setAttribute('radius',0.35)
bulb.setAttribute('color',color)

bulb.setAttribute(
'material',
`emissive:${color}; emissiveIntensity:4`
)

scene.appendChild(bulb)

}



/* BUILDINGS */

for(let i = 0; i < 90; i++){

const tower =
document.createElement('a-box')

const width =
Math.random()*8 + 4

const height =
Math.random()*90 + 20

const depth =
Math.random()*8 + 4

const x =
(Math.random()-0.5)*700

const z =
-Math.random()*1500 - 100

tower.setAttribute(
'position',
`${x} ${height/2} ${z}`
)

tower.setAttribute('width',width)
tower.setAttribute('height',height)
tower.setAttribute('depth',depth)

tower.setAttribute(
'color',
'#151720'
)

tower.setAttribute(
'material',
'metalness:0.5; roughness:0.4'
)

scene.appendChild(tower)

}



/* CAMERA FLOAT */

let angle = 0

setInterval(()=>{

angle += 0.003

const current =
rig.getAttribute('position')

const y =
1.7 + Math.cos(angle)*0.1

rig.setAttribute(
'position',
`${current.x} ${y} ${current.z}`
)

},30)



/* W KEY MOVEMENT */

document.addEventListener('keydown',(e)=>{

if(!gameStarted) return

const current =
rig.getAttribute('position')



/* FORWARD */

if(e.key === 'w' || e.key === 'W'){

rig.setAttribute(
'position',
`${current.x} ${current.y} ${current.z - 3}`
)

}



/* LEFT */

if(e.key === 'a' || e.key === 'A'){

rig.setAttribute(
'position',
`${current.x - 2} ${current.y} ${current.z}`
)

}



/* RIGHT */

if(e.key === 'd' || e.key === 'D'){

rig.setAttribute(
'position',
`${current.x + 2} ${current.y} ${current.z}`
)

}

})



/* ALERTS */

const alerts = [

'MULTIVERSE CORE ONLINE',
'WORMHOLE DETECTED',
'AI GRID ACTIVE',
'QUANTUM ENERGY MAXIMUM',
'REALITY DISTORTION ACTIVE',
'MEGA CITY ONLINE'

]

let index = 0

setInterval(()=>{

index++

if(index >= alerts.length){

index = 0

}

alertText.innerHTML =
alerts[index]

},4000)

</script>

</body>
</html>
