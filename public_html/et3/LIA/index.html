<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cyber Gaming Portal</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
overflow:hidden;
background:black;
font-family:Arial,sans-serif;
transition:filter 0.3s ease;
}



/* HUD */

.hud{
position:absolute;
top:25px;
left:30px;
z-index:100;
color:#00ffff;

text-shadow:
0 0 10px #00ffff,
0 0 30px #00ffff,
0 0 60px #00ffff;
}

.hud h1{
font-size:2.5rem;
letter-spacing:6px;
}

.hud p{
margin-top:8px;
font-size:0.9rem;
color:white;
letter-spacing:3px;
}



/* STATUS */

.status{
position:absolute;
bottom:30px;
right:30px;
z-index:100;
color:#9d4edd;
text-align:right;
font-size:0.85rem;
letter-spacing:2px;

text-shadow:
0 0 10px #9d4edd,
0 0 30px #9d4edd;
}



/* SCANLINES */

.scanline{
position:absolute;
inset:0;
pointer-events:none;
z-index:999;

background:
repeating-linear-gradient(
to bottom,
rgba(255,255,255,0.03),
rgba(255,255,255,0.03) 1px,
transparent 1px,
transparent 4px
);
}



/* VIGNETTE */

.vignette{
position:absolute;
inset:0;
pointer-events:none;
z-index:998;

background:
radial-gradient(
circle,
transparent 45%,
rgba(0,0,0,0.85) 100%
);
}

</style>

</head>

<body>



<!-- START SCREEN -->

<div id="startScreen"

style="
position:fixed;
inset:0;
background:rgba(0,0,0,0.93);
z-index:5000;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
text-align:center;
color:white;
font-family:Arial;
">

<h1 style="
font-size:3rem;
color:#00ffff;
text-shadow:0 0 25px #00ffff;
margin-bottom:20px;
">

CYBER GAMING PORTAL

</h1>

<p style="
font-size:1.2rem;
max-width:700px;
line-height:1.8;
padding:0 30px;
">

Keep tapping the
<span style="color:#00ffff;">W</span>
key to move forward through the cyber city.

<br><br>

Use
<span style="color:#00ffff;">A</span>
and
<span style="color:#00ffff;">D</span>
to dodge buildings.

</p>

<button id="startBtn"

style="
margin-top:40px;
padding:18px 45px;
font-size:1rem;
border:none;
border-radius:14px;
background:#00ffff;
color:black;
font-weight:bold;
cursor:pointer;
box-shadow:0 0 25px #00ffff;
">

START GAME

</button>

</div>



<!-- CRASH SCREEN -->

<div id="crashScreen"

style="
position:fixed;
inset:0;
background:rgba(0,0,0,0.95);
z-index:6000;
display:none;
justify-content:center;
align-items:center;
flex-direction:column;
text-align:center;
color:white;
font-family:Arial;
">

<h1 style="
font-size:4rem;
color:#ff004c;
text-shadow:0 0 30px #ff004c;
margin-bottom:20px;
">

YOU CRASHED

</h1>

<p style="
font-size:1.2rem;
letter-spacing:3px;
line-height:1.7;
">

A BUILDING COLLISION OCCURRED

</p>

<button onclick="location.reload()"

style="
margin-top:40px;
padding:18px 45px;
font-size:1rem;
border:none;
border-radius:14px;
background:#ff004c;
color:white;
font-weight:bold;
cursor:pointer;
box-shadow:0 0 25px #ff004c;
">

PLAY AGAIN

</button>

</div>



<!-- HUD -->

<div class="hud">

<h1>CYBER GAMING PORTAL</h1>

<p id="alertText">
MULTIVERSE CORE ONLINE
</p>

</div>



<!-- STATUS -->

<div class="status">

CITY STATUS: ONLINE<br>
NEURAL GRID: ACTIVE<br>
QUANTUM ENERGY: STABLE

</div>



<div class="scanline"></div>
<div class="vignette"></div>



<a-scene
id="scene"
renderer="antialias:true; colorManagement:true;"
fog="type: exponential; color: #020208; density: 0.02">



<!-- ASSETS -->

<a-assets>

<a-asset-item
id="chair"
src="./assets/chair.glb">
</a-asset-item>

</a-assets>



<!-- CAMERA -->

<a-entity
id="rig"
position="0 1.7 12">

<a-camera
look-controls>

<a-cursor
color="#00ffff">
</a-cursor>

</a-camera>

</a-entity>



<!-- SKY -->

<a-sky color="#020208"></a-sky>



<!-- LIGHTING -->

<a-light
type="ambient"
color="#ffffff"
intensity="1.4">
</a-light>

<a-light
type="directional"
position="0 30 -20"
color="#00ffff"
intensity="2">
</a-light>



<!-- GROUND -->

<a-plane
position="0 0 0"
rotation="-90 0 0"
width="1000"
height="7000"
color="#111217">
</a-plane>



<!-- ROAD -->

<a-box
position="0 0.05 -1700"
width="14"
height="0.1"
depth="6000"
color="#1b1d25">
</a-box>



<!-- ROAD LINES -->

<a-box
position="-7 0.08 -1700"
width="0.08"
height="0.03"
depth="6000"
color="#00ffff"
material="emissive:#00ffff">
</a-box>

<a-box
position="7 0.08 -1700"
width="0.08"
height="0.03"
depth="6000"
color="#00ffff"
material="emissive:#00ffff">
</a-box>



<!-- ROTATING CHAIR -->

<a-entity
position="0 0 -8"
rotation="0 180 0"
scale="3 3 3"

animation="
property: rotation;
to: 0 540 0;
loop: true;
dur: 6000;
easing: linear
">

<a-gltf-model
src="#chair">
</a-gltf-model>

</a-entity>



</a-scene>



<script>

const scene =
document.querySelector('#scene')

const rig =
document.querySelector('#rig')

const alertText =
document.querySelector('#alertText')

const startScreen =
document.querySelector('#startScreen')

const startBtn =
document.querySelector('#startBtn')

const crashScreen =
document.querySelector('#crashScreen')

let gameStarted = false
let crashed = false

const buildings = []



/* START GAME */

startBtn.addEventListener('click',()=>{

startScreen.style.display = 'none'

gameStarted = true

})



/* STARFIELD */

for(let i = 0; i < 500; i++){

const star =
document.createElement('a-sphere')

star.setAttribute(
'radius',
Math.random()*0.05 + 0.01
)

star.setAttribute(
'position',
`
${(Math.random()-0.5)*1500}
${(Math.random()-0.5)*800}
${-Math.random()*7000}
`
)

star.setAttribute(
'color',
Math.random() > 0.5
? '#00ffff'
: '#ffffff'
)

star.setAttribute(
'material',
'emissive:#ffffff'
)

scene.appendChild(star)

}



/* =========================================
MEGA STREET LIGHTS
========================================= */

for(let i = 0; i < 180; i++){

const z = -20 - i * 35

createStreetLight(
-10,
z,
i % 2 === 0 ? '#00ffff' : '#9d4edd'
)

createStreetLight(
10,
z,
i % 2 === 0 ? '#9d4edd' : '#00ffff'
)



/* MINI ROAD LIGHTS */

createMiniLights(-6,z)
createMiniLights(6,z)

}



/* STREET LIGHT FUNCTION */

function createStreetLight(x,z,color){

/* POLE */

const pole =
document.createElement('a-cylinder')

pole.setAttribute(
'position',
`${x} 4 ${z}`
)

pole.setAttribute(
'radius',
0.08
)

pole.setAttribute(
'height',
8
)

pole.setAttribute(
'color',
'#2a2a35'
)

scene.appendChild(pole)



/* GLOW BULB */

const bulb =
document.createElement('a-sphere')

bulb.setAttribute(
'position',
`${x} 8 ${z}`
)

bulb.setAttribute(
'radius',
0.4
)

bulb.setAttribute(
'color',
color
)

bulb.setAttribute(
'material',
`
emissive:${color};
emissiveIntensity:8;
shader:standard;
`
)

scene.appendChild(bulb)



/* HALO */

const halo =
document.createElement('a-circle')

halo.setAttribute(
'position',
`${x} 7.8 ${z}`
)

halo.setAttribute(
'rotation',
'-90 0 0'
)

halo.setAttribute(
'radius',
2.2
)

halo.setAttribute(
'color',
color
)

halo.setAttribute(
'material',
`
shader:flat;
opacity:0.15;
transparent:true;
side:double;
`
)

scene.appendChild(halo)



/* GROUND GLOW */

const groundGlow =
document.createElement('a-circle')

groundGlow.setAttribute(
'position',
`${x} 0.03 ${z}`
)

groundGlow.setAttribute(
'rotation',
'-90 0 0'
)

groundGlow.setAttribute(
'radius',
3
)

groundGlow.setAttribute(
'color',
color
)

groundGlow.setAttribute(
'material',
`
shader:flat;
opacity:0.12;
transparent:true;
side:double;
`
)

scene.appendChild(groundGlow)

}



/* MINI ROAD LIGHTS */

function createMiniLights(x,z){

const mini =
document.createElement('a-box')

mini.setAttribute(
'position',
`${x} 0.12 ${z}`
)

mini.setAttribute(
'width',
0.25
)

mini.setAttribute(
'height',
0.05
)

mini.setAttribute(
'depth',
0.25
)

mini.setAttribute(
'color',
'#00ffff'
)

mini.setAttribute(
'material',
'emissive:#00ffff; emissiveIntensity:5'
)

scene.appendChild(mini)

}



/* BUILDINGS */

for(let i = 0; i < 90; i++){

const tower =
document.createElement('a-box')

const width =
Math.random()*6 + 4

const height =
Math.random()*70 + 20

const depth =
Math.random()*6 + 4



/* KEEP BUILDINGS OUTSIDE ROAD */

const side =
Math.random() > 0.5 ? 1 : -1

const x =
side * (20 + Math.random()*120)



/* ORGANIZED DISTANCE */

const z =
-100 - i * 35



tower.setAttribute(
'position',
`${x} ${height/2} ${z}`
)

tower.setAttribute(
'width',
width
)

tower.setAttribute(
'height',
height
)

tower.setAttribute(
'depth',
depth
)

tower.setAttribute(
'color',
'#151720'
)

tower.setAttribute(
'material',
`
metalness:0.8;
roughness:0.25;
emissive:#050505;
envMapIntensity:1;
`
)

scene.appendChild(tower)



/* WINDOWS */

for(let w = 0; w < 12; w++){

const windowLight =
document.createElement('a-plane')

windowLight.setAttribute(
'width',
0.4
)

windowLight.setAttribute(
'height',
0.6
)

windowLight.setAttribute(
'position',
`
${x + width/2 + 0.02}
${3 + w*3}
${z}
`
)

windowLight.setAttribute(
'rotation',
'0 -90 0'
)

const windowColor =
Math.random() > 0.5
? '#00ffff'
: '#9d4edd'

windowLight.setAttribute(
'color',
windowColor
)

windowLight.setAttribute(
'material',
`
emissive:${windowColor};
emissiveIntensity:4;
`
)

scene.appendChild(windowLight)

}



buildings.push({

x:x,
z:z,
width:width,
depth:depth,
element:tower

})

}



/* CAMERA FLOAT */

let angle = 0

setInterval(()=>{

angle += 0.003

const current =
rig.getAttribute('position')

const y =
1.7 + Math.cos(angle)*0.1

rig.setAttribute(
'position',
`${current.x} ${y} ${current.z}`
)

},30)



/* MOVEMENT */

document.addEventListener('keydown',(e)=>{

if(!gameStarted || crashed) return

const current =
rig.getAttribute('position')



/* FORWARD */

if(e.key === 'w' || e.key === 'W'){

rig.setAttribute(
'position',
`${current.x} ${current.y} ${current.z - 1.5}`
)

}



/* LEFT */

if(e.key === 'a' || e.key === 'A'){

rig.setAttribute(
'position',
`${current.x - 1.2} ${current.y} ${current.z}`
)

}



/* RIGHT */

if(e.key === 'd' || e.key === 'D'){

rig.setAttribute(
'position',
`${current.x + 1.2} ${current.y} ${current.z}`
)

}

})



/* BUILDING COLLISION */

setInterval(()=>{

if(!gameStarted || crashed) return

const pos =
rig.getAttribute('position')

for(let building of buildings){

const bx = building.x
const bz = building.z
const bw = building.width
const bd = building.depth

const hitX =
Math.abs(pos.x - bx)
<
bw/2

const hitZ =
Math.abs(pos.z - bz)
<
bd/2

if(hitX && hitZ){

crashEffect(building.element)

break

}

}

},100)



/* CRASH EFFECT */

function crashEffect(building){

crashed = true

alertText.innerHTML =
'YOU CRASHED'

document.body.style.filter =
'brightness(4) saturate(3) hue-rotate(-40deg)'



/* BUILDING FALL */

building.setAttribute(
'animation__fallRotate',
'property: rotation; to: 0 0 35; dur: 700; easing: easeOutQuad'
)

building.setAttribute(
'animation__fallDown',
`property: position;
to:
${building.object3D.position.x}
-20
${building.object3D.position.z};
dur: 1500;
easing: easeInQuad`
)



/* RESET FILTER */

setTimeout(()=>{

document.body.style.filter =
'brightness(1)'

},500)



/* SHOW CRASH SCREEN */

setTimeout(()=>{

crashScreen.style.display =
'flex'

},1200)

}



/* ALERTS */

const alerts = [

'MULTIVERSE CORE ONLINE',
'WORMHOLE DETECTED',
'AI GRID ACTIVE',
'QUANTUM ENERGY MAXIMUM',
'REALITY DISTORTION ACTIVE',
'MEGA CITY ONLINE'

]

let index = 0

setInterval(()=>{

if(crashed) return

index++

if(index >= alerts.length){

index = 0

}

alertText.innerHTML =
alerts[index]

},4000)

</script>

</body>
</html>
