<!DOCTYPE html>
<html>
<head>
<script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>

<!-- 🌊 WAVE -->
<script>
AFRAME.registerComponent('wave',{
  schema:{amplitude:{default:0.4},wavelength:{default:5},speed:{default:2}},
  init:function(){
    this.clock=0;
    this.mesh=this.el.getObject3D('mesh');
    this.geometry=this.mesh.geometry;
    this.original=this.geometry.attributes.position.array.slice();
  },
  tick:function(time,delta){
    this.clock+=delta/1000;
    const pos=this.geometry.attributes.position.array;
    for(let i=0;i<pos.length;i+=3){
      const x=pos[i];
      pos[i+2]=this.original[i+2]+
        Math.sin((x/this.data.wavelength)+this.clock*this.data.speed)
        *this.data.amplitude;
    }
    this.geometry.attributes.position.needsUpdate=true;
  }
});
</script>

<!-- 🌬 WIND -->
<script>
AFRAME.registerComponent('wind',{
  schema:{intensity:{default:3},speed:{default:1}},
  init:function(){this.t=0;},
  tick:function(time,delta){
    this.t+=delta/1000;
    const sway=Math.sin(this.t*this.data.speed)*this.data.intensity;
    this.el.object3D.rotation.z=THREE.MathUtils.degToRad(sway);
  }
});
</script>

<!-- 🌥 CLOUD MOVE -->
<script>
AFRAME.registerComponent('cloud-move',{
  schema:{speed:{default:0.5},range:{default:100}},
  init:function(){this.startX=this.el.object3D.position.x;},
  tick:function(time){
    const move=(time/1000)*this.data.speed;
    this.el.object3D.position.x=this.startX+(move%this.data.range);
  }
});
</script>

<!-- ✨ STARFIELD -->
<script>
AFRAME.registerComponent('starfield',{
  schema:{count:{default:180},radius:{default:80}},
  init:function(){
    for(let i=0;i<this.data.count;i++){
      const star=document.createElement('a-sphere');
      const r=this.data.radius;

      const theta=Math.random()*Math.PI*2;
      const phi=(Math.random()*0.6)*Math.PI;
      const x=r*Math.sin(phi)*Math.cos(theta);
      const y=Math.abs(r*Math.cos(phi));
      const z=r*Math.sin(phi)*Math.sin(theta);

      star.setAttribute('position',`${x} ${y} ${z}`);
      star.setAttribute('radius',0.08);
      star.setAttribute('material','shader:flat; color:#ffffff; transparent:true; opacity:0.9; depthTest:false;');
      this.el.appendChild(star);
    }
  }
});
</script>

<!-- 🌅 DAY CYCLE (FIXED) -->
<script>
AFRAME.registerComponent('daycycle',{
  schema:{duration:{default:120}},
  init:function(){
    this.t=0;
    this.sky=document.querySelector('#sky');
    this.light=document.querySelector('#dirLight');
    this.sun=document.querySelector('#sun');
    this.moon=document.querySelector('#moon');
    this.stars=document.querySelector('#stars');

    // Keep your original palette, but we'll blend smoothly using sun altitude
    this.cSunrise=new THREE.Color('#ffb347');
    this.cDay=new THREE.Color('#7ec0ee');
    this.cSunset=new THREE.Color('#ff7e5f');
    this.cDusk=new THREE.Color('#1c2541');
    this.cNight=new THREE.Color('#000000');
  },

  // smoothstep
  smooth:function(edge0, edge1, x){
    const t = THREE.MathUtils.clamp((x-edge0)/(edge1-edge0), 0, 1);
    return t*t*(3-2*t);
  },

  blend:function(a,b,t){
    const c=a.clone();
    c.lerp(b, THREE.MathUtils.clamp(t,0,1));
    return "#"+c.getHexString();
  },

  tick:function(time,delta){
    this.t+=delta/1000;
    const p=(this.t%this.data.duration)/this.data.duration;

    // Sun path (same as yours)
    const angle=(p*Math.PI*2)-(Math.PI/2);
    const sunX=Math.cos(angle)*15;
    const sunY=Math.sin(angle)*10;

    this.sun.object3D.position.set(sunX,sunY,-20);
    this.moon.object3D.position.set(-sunX,-sunY,-20);

    // -------------------------
    // ✅ FIXED SKY BLENDING
    // Drive sky from sun altitude (continuous across p wrap),
    // so midnight (p≈1 and p≈0) matches and DOESN'T POP to sunrise.
    // -------------------------

    // Normalize sun altitude to -1..+1
    const sunAlt = sunY / 10; // -1 (midnight) .. +1 (midday)

    // Daylight amount (0 at night, 1 at day) with smooth twilight band
    // Adjust these edges to change sunrise/sunset length:
    // -0.15..0.10 = longer twilight
    const daylight = this.smooth(-0.15, 0.10, sunAlt);

    // How "low on horizon" the sun is (warm tint zone around sunrise/sunset)
    // Peaks at horizon, fades away as sun goes higher or deeper night
    const horizonBand = 0.35; // bigger = wider warm zone
    const nearHorizon = THREE.MathUtils.clamp(1 - Math.abs(sunAlt)/horizonBand, 0, 1);

    // Is the sun rising (morning) or setting (evening)?
    // derivative of sin(angle) is cos(angle)
    const rising = Math.cos(angle) > 0;

    // Base sky: night <-> day
    let baseSky = this.cNight.clone().lerp(this.cDay, daylight);

    // Add dusk influence when sun is just below horizon (prevents harsh night->day look)
    // duskStrength is strong when slightly below horizon
    const duskStrength = this.smooth(-0.50, -0.05, sunAlt) * (1 - daylight);
    baseSky.lerp(this.cDusk, duskStrength);

    // Warm sunrise/sunset tint only when near horizon and not full daylight
    const warmColor = rising ? this.cSunrise : this.cSunset;
    const warmStrength = nearHorizon * (1 - daylight) * 0.85;
    baseSky.lerp(warmColor, warmStrength);

    this.sky.setAttribute("color", "#"+baseSky.getHexString());

    // -------------------------
    // LIGHT (keep yours but use daylight computed from altitude for smoother behavior)
    // -------------------------
    this.light.setAttribute("intensity", 0.12 + daylight * 0.88);

    // -------------------------
    // VISIBILITY (your logic kept, still based on sunY)
    // -------------------------
    const sunAbove = sunY > -1;
    this.sun.setAttribute("visible", sunAbove);

    const moonVisible = sunY < -2;
    this.moon.setAttribute("visible", moonVisible);

    const nightStrength = Math.max(0, (-sunY - 2) / 8);

    this.stars.object3D.visible = nightStrength > 0.05;

    this.stars.object3D.children.forEach(star => {
      if (star.material) {
        star.material.opacity = nightStrength;
        star.material.needsUpdate = true;
      }
    });
  }
});
</script>
</head>
